name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veritrack
          POSTGRES_PASSWORD: veritrack
          POSTGRES_DB: veritrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veritrack"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr \
            fonts-freefont-ttf fonts-dejavu-core fonts-crosextra-carlito fonts-liberation
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium   # renders the synthetic GETS test sheets
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps "opencv-python-headless>=4.10"
      - name: Lint
        run: ruff check app scripts tests e2e
      - name: Tests
        run: pytest -q tests

  frontend:
    name: Frontend (types + lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
