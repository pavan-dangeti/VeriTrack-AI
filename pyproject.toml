[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # asserts allowed in tests
    "B008",  # FastAPI: Depends(...) in parameter defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env config must precede app imports
"tests/*" = ["S106", "S105", "B008"]  # test creds + FastAPI Depends defaults
"scripts/capture_media.py" = ["S603"]  # runs the local ffmpeg binary
"e2e/*" = ["S105", "S106", "S108", "S110", "S311"]  # browser tests: temp screenshots, best-effort cleanup, test data
