services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: veritrack
      POSTGRES_PASSWORD: veritrack
      POSTGRES_DB: veritrack_foundation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://veritrack:veritrack@db:5432/veritrack_foundation
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - storage:/srv/storage-data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bootstrap NEVER falls back to a default credential (Strix vuln-0003):
    # compose refuses to start without an explicit SEED_ADMIN_PASSWORD.
    command: >
      sh -c 'if [ -z "$$SEED_ADMIN_PASSWORD" ]; then
               echo "SEED_ADMIN_PASSWORD must be set in .env before first boot" >&2;
               exit 1;
             fi &&
             alembic upgrade head &&
             python -m app.cli create-master-admin --if-not-exists &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000'

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://veritrack:veritrack@db:5432/veritrack_foundation
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - storage:/srv/storage-data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=INFO --concurrency=4

volumes:
  pgdata:
  storage:
