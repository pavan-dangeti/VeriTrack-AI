version: "3.9"

services:

  veritrack-api:

    build: .

    container_name: veritrack-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    depends_on:
      - postgres

  postgres:

    image: postgres:16

    container_name: veritrack-db

    environment:
      POSTGRES_DB: veritrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: