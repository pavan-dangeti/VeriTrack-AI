[pytest]
# Real-browser end-to-end suite. Kept fully separate from tests/ (the API
# suite): this ini makes e2e/ its own rootdir, so tests/conftest.py and the
# asyncio settings in pyproject.toml are never loaded.
addopts = -p no:cacheprovider -p no:asyncio -ra
testpaths = .
python_files = test_*.py
markers =
    e2e: real-browser end-to-end test
